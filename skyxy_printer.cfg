[include fluidd.cfg]

# OPTIONS
[pause_resume]
[gcode_arcs]

# ACCEL SETTING #
#[mcu adxl]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_E6626005A7402534-if00

#[adxl345]
#cs_pin: adxl:gpio9
#spi_software_sclk_pin: adxl:gpio10
#spi_software_mosi_pin: adxl:gpio11
#spi_software_miso_pin: adxl:gpio12
#axes_map: y,z,-x

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    150,150, 20

# PRINTHEAD #
[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 22.222
gear_ratio: 50:10
full_steps_per_rotation: 400
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
pid_kp = 21.418
pid_ki = 1.200
pid_kd = 95.578
min_temp: 0
max_temp: 265
max_extrude_only_distance: 1000.0

[tmc2209 extruder]
uart_pin: PD9
interpolate: true
run_current: 0.550
stealthchop_threshold: 0

[heater_fan hotend_fan]
pin: PB1   # hotend fan

[fan]
pin: PC14   # aux fan
kick_start_time: 0.200

# BED #
[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_kp = 57.203
pid_ki = 1.907
pid_kd = 429.025
min_temp: 0
max_temp: 115

# STEPPERS #
[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 300
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PD5
diag_pin: ^PA15
run_current: 1.0
interpolate: true
driver_SGTHRS: 58
stealthchop_threshold: 0

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 300
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD7
diag_pin: ^PD2
run_current: 1.0
interpolate: true
driver_SGTHRS: 58
stealthchop_threshold: 0

[stepper_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: !PC8
position_endstop: 0.5
position_max: 265

[tmc2209 stepper_z]
uart_pin: PD4
interpolate: true
run_current: 0.850
stealthchop_threshold: 999999

[input_shaper]
shaper_type_x = 2hump_ei
shaper_freq_x = 100.4
shaper_type_y = 2hump_ei
shaper_freq_y = 84.8


# SENSORS #
[temperature_sensor Host]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

# Температура чипа платы принтера
[temperature_sensor MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_4B002E001650314335393520-if00

[virtual_sdcard]
path: /home/skyxy/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 6000
max_z_velocity: 15
max_z_accel: 1000