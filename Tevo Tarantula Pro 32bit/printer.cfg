[include gcode_macro.cfg]

# OPTIONS
[pause_resume]
[gcode_arcs]

### ACCEL SETTING ###
#[mcu adxl]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_E6626005A7402534-if00

#[adxl345]
#cs_pin: adxl:gpio9
#spi_software_sclk_pin: adxl:gpio10
#spi_software_mosi_pin: adxl:gpio11
#spi_software_miso_pin: adxl:gpio12
#axes_map: -x,y,z

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    120,120, 20

#PRINTER SETTINGS
[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_02E0FF0B881C4AAFA88E685DC12000F5-if00

[virtual_sdcard]
path: /home/ttpro/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[stepper_x]
step_pin: P2.2
dir_pin: !P2.3
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: ^!P1.29  # ^P1.28 for X-max
position_endstop: -3.5
position_min: -3.5
position_max: 240 #235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: P1.1
run_current: 1.06
interpolate:true
stealthchop_threshold: 999999

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: ^!P1.27  # ^P1.26 for Y-max
position_endstop: 0
position_max: 240 #235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: P1.8
run_current: 1.06
interpolate:true
stealthchop_threshold: 999999

[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: ^!P1.25  # ^P1.24 for Z-max
position_endstop: 0
position_max: 260

[tmc2209 stepper_z]
uart_pin: P1.10
run_current: 0.650
stealthchop_threshold: 999999

[stepper_z1]
step_pin: P0.1
dir_pin: P0.0
enable_pin: !P0.10
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: P1.17
run_current: 0.650
stealthchop_threshold: 999999

[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 7.8818
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.23
control: pid
pid_kp = 16.703
pid_ki = 0.733
pid_kd = 95.204
min_temp: 0
max_temp: 260

[tmc2209 extruder]
uart_pin: P1.15
run_current: 0.800
stealthchop_threshold: 999999

[heater_fan exturder1_fan]
pin: P2.6

[fan]
pin: P2.4
kick_start_time: 0.200

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
control: watermark
min_temp: 0
max_temp: 110

[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 3600
max_z_velocity: 25
max_Z_accel: 100

[input_shaper]
shaper_type_x: ei
shaper_freq_x: 50.4
shaper_type_y: mzv
shaper_freq_y: 36.6

[display]
lcd_type: uc1701
contrast: 40
cs_pin: EXP1_6
a0_pin: EXP1_7
encoder_pins:  ^!EXP2_5, ^!EXP2_3
click_pin: ^!EXP1_2
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[output_pin beeper]
pin: EXP1_1

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.31, EXP1_3=P0.18, EXP1_5=P0.15, EXP1_7=P1.0,  EXP1_9=<GND>,
    EXP1_2=P1.30, EXP1_4=P0.16, EXP1_6=P0.17, EXP1_8=P1.22, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.8, EXP2_3=P3.25, EXP2_5=P3.26, EXP2_7=P0.27, EXP2_9=<GND>,
    EXP2_2=P0.7, EXP2_4=P0.28, EXP2_6=P0.9,  EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp1"


[homing_override]
set_position_z: 0
axes: xy
gcode:
    G90   
    G1 Z2 F300
    G28 X0 Y0
    G28 Z0
