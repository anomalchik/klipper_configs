[gcode_macro HOME_ALL_AND_LIFT_Z]
description: Make Home for all axis and lift Z to 5mm.
gcode:
    G28
    G90
    G1 Z5 F300

[gcode_macro START_PRINT]
description: Start gcode
gcode:
    {% set bed_temp = params.BED | default(0)| float %}
    {% set nozzle_temp = params.NOZZLE | default(0)| float %}

    {% if nozzle_temp < printer.configfile.settings.extruder.min_extrude_temp %}
        CANCEL_PRINT
    {% else %}
        M107
        G28
        G0 Z30 F3000
        G0 Y200 F3000


        # SET BED TEMP AND WAIT IT TO BE REACHED
        M190 S{bed_temp}

        # SET NOZZLE TEMP AND WAIT IT TO BE REACHED
        M109 S{nozzle_temp}
    {% endif %}

[gcode_macro FINISH_PRINT]
description: Finish print gcode
gcode:
    TURN_OFF_HEATERS
    M107 ;AUX FAN OFF
    G91 ;RELATIVE POS
    {% if printer.extruder.can_extrude %} G1 E-1 F300 {% endif %}
    G1 Z+3.5 F3000
    G90 ;ABSOLUTE POS
    G1 X0 Y220 F3000
    M84