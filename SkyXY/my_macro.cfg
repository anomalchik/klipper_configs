[gcode_macro HOME_ALL_AND_LIFT_Z]
description: Make Home for all axis and lift Z to 5mm.
gcode:
    SET_SKEW CLEAR=1
    BED_MESH_CLEAR
    G28
    G90
    G1 Z5 F300


[gcode_macro BED_SCREW_CALIBRATION]
description: Bed calibration by screws (NEED PHONE RUN)
gcode:
    SET_SKEW CLEAR=1
    BED_MESH_CLEAR
    G28
    M109 S200
    BED_SCREWS_ADJUST

[gcode_macro MANUAL_BED_MESH]
description: Home all and make bed mesh with paper method.
gcode:
    SET_SKEW CLEAR=1
    BED_MESH_CLEAR
    G28
    G0 Z2
    M109 S200
    BED_MESH_CALIBRATE METHOD=manual
    
[gcode_macro FULL_BED_CALIBRATION]
description: Runs BED_SCREW_CALIBRATION and MANUAL_BED_MESH calibrations.
gcode:
    BED_SCREW_CALIBRATION
    MANUAL_BED_MESH

[gcode_macro PRINT_START]
description: Start gcode
gcode:
    {% set bed_temp = params.BED | default(0)| float %}
    {% set extruder_temp = params.EXTRUDER | default(0)| float %}
    {% set chamber_htimeout = params.CHAMBER_PREHEAT | default(0)| float %}

    {% if extruder_temp < printer.configfile.settings.extruder.min_extrude_temp %}
        CANCEL_PRINT
    {% else %}
        BED_MESH_CLEAR
        SET_SKEW CLEAR=1
        M107
        G28
        G0 Z50 F1000

        # SET BED TEMP AND WAIT IT TO BE REACHED
        M190 S{bed_temp}

        # SET NOZZLE TEMP AND WAIT IT TO BE REACHED
        M109 S{extruder_temp}
        
        # ZERO E
        G92 E0
        G1 E3 F200
        # ZERO E AGAIN
        G92 E0
        # RETURN FEEDRATE
        G0 F6000
    {% endif %}

[gcode_macro PRINT_END]
description: Finish print gcode
gcode:
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    {% if printer.extruder.can_extrude %} G1 E-1 F300 {% endif %}
    TURN_OFF_HEATERS
    M107 ;AUX FAN OFF
    G91 ;RELATIVE POS
    G1 Z+3.5 F3000
    G90 ;ABSOLUTE POS
    G1 X0 Y270 F3000
    M84