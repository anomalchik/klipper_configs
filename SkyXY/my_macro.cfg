[gcode_macro MAKE_BEEP]
description: Beep sound macros.
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set beeper = cfg.get("output_pin beeper" ,
            cfg.get("pwm_cycle_time beeper")) %}
    {% if beeper is not none %}
        {% set count = params.COUNT | default(1) | int(-1) %}
        {% set duration = params.DURATION | default(500) | int(-1) %}
        {% set delay = params.DELAY | default(500) | int(-1) %}
        
        {% if count <= 0 %}
            {% set count = 1 %}
        {% endif %}
        
        {% if duration < 100 %}
            {% set duration = 100 %}
        {% endif %}
        
        {% if delay < 0 %}
            {% set delay = 100 %}
        {% endif %}
        
        {% set on_value = beeper.get("scale",1.0) | float %}
        
        {% for i in range(count) %}
            G4 P{delay}
            SET_PIN PIN=beeper VALUE={on_value}
            G4 P{duration}
            SET_PIN PIN=beeper VALUE=0
        {% endfor %}
   
    {% endif %}       

[gcode_macro DISABLE_CALS]
description: Disabling calibrations that affect movements.
gcode:
    {% if printer.configfile.settings.skew_correction is defined %}
        SET_SKEW CLEAR=1
    {% endif %}
    {% if printer.configfile.settings.bed_mesh is defined %}
        BED_MESH_CLEAR
    {% endif %}

[gcode_macro HOME_ALL_AND_LIFT_Z]
description: Make Home for all axis and lift Z to 5mm.
gcode:
    DISABLE_CALS
    G28
    G90
    G1 Z5 F300

[gcode_macro BED_SCREW_CALIBRATION]
description: Bed calibration by screws (NEED PHONE RUN)
gcode:
    DISABLE_CALS
    G28
    M109 S150
    BED_SCREWS_ADJUST

[gcode_macro MANUAL_BED_MESH]
description: Home all and make bed mesh with paper method.
gcode:
    DISABLE_CALS
    G28
    G0 Z2
    M109 S150
    BED_MESH_CALIBRATE METHOD=manual

[gcode_macro PRINT_START]
description: Start gcode
gcode:
    {% set bed_temp = params.BED | default(0)| float %}
    {% set extruder_temp = params.EXTRUDER | default(0)| float %}

    {% if extruder_temp < printer.configfile.settings.extruder.min_extrude_temp %}
        CANCEL_PRINT
    {% else %}
        DISABLE_CALS
        M107
        G28
        G0 Z50 F1000

        # SET BED TEMP AND WAIT IT TO BE REACHED
        M190 S{bed_temp}

        # SET NOZZLE TEMP AND WAIT IT TO BE REACHED
        M109 S{extruder_temp}
        
        # ZERO E
        G92 E0
        G1 E3 F200
        # ZERO E AGAIN
        G92 E0
        # RETURN FEEDRATE
        G0 F6000
    {% endif %}

[gcode_macro PRINT_END]
description: Finish print gcode
gcode:
    {% set beep = params.BEEP | default(0) == "1" %}
    {% set homed = printer.toolhead.homed_axes == "xyz" %}
    {% set max_z = printer.toolhead.axis_maximum.z | float %}
    {% set max_y = printer.toolhead.axis_maximum.y | float %}

    DISABLE_CALS
    TURN_OFF_HEATERS
    M107 ;AUX FAN OFF
    G90 ;ABSOLUTE POS
    {% if homed %}
        {% set current_pos = printer.toolhead.position %}
        {% set remaining = [max_z - current_pos.z - 0.5, 0.0] | max %}
        {% set lift_z = [3.5, remaining] | min %}
    
        G91 ;RELATIVE POS
        {% if lift_z > 0 %}
            G1 Z{lift_z} F3000
        {% endif %}
    
        G1 X{0.0 - current_pos.x} Y{max_y - 10.0 - current_pos.y} F3000
        
        G90 ;ABSOLUTE POS
        {% if beep %}
            MAKE_BEEP COUNT=2 DURATION=500 DELAY=400
        {% endif %}
    {% else %}
        RESPOND MSG="Need home axis first"
        {% if beep %}
            MAKE_BEEP COUNT=4 DURATION=100 DELAY=100
        {% endif %}
    {% endif %}
    
    M84